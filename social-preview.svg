<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" x="105" y="160" width="280" height="280" role="img" aria-label="Omnix logo">
  <defs>
    <radialGradient id="bh-glow" cx="100" cy="100" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0.30" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#5277C3" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5277C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bh-disk" x1="8" y1="0" x2="192" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7EBAE4" stop-opacity="0.2"/>
      <stop offset="0.22" stop-color="#E0F2FE"/>
      <stop offset="0.42" stop-color="#7EBAE4"/>
      <stop offset="0.7" stop-color="#5277C3"/>
      <stop offset="0.9" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bh-lens" x1="0" y1="46" x2="0" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0F9FF"/>
      <stop offset="0.3" stop-color="#7EBAE4"/>
      <stop offset="0.75" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5277C3"/>
    </linearGradient>
    <linearGradient id="bh-ring" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="bh-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="bh-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="bh-front"><rect x="0" y="100" width="200" height="100"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bh-glow)"/>
  <g transform="rotate(-12 100 100)">
    <!-- far side of the disk, bent by gravity into a halo: thick over the top, thin underneath -->
    <path d="M48 95a52 49 0 1 0 104 0a52 49 0 1 0 -104 0Z M64 100a36 36 0 1 1 72 0a36 36 0 1 1 -72 0Z" fill="url(#bh-lens)" fill-rule="evenodd" opacity="0.55" filter="url(#bh-blur)"/>
    <path d="M51 96a49 46 0 1 0 98 0a49 46 0 1 0 -98 0Z M64 100a36 36 0 1 1 72 0a36 36 0 1 1 -72 0Z" fill="url(#bh-lens)" fill-rule="evenodd"/>
    
    <g>
      <ellipse cx="100" cy="100" rx="78" ry="13" fill="none" stroke="url(#bh-disk)" stroke-width="16" opacity="0.6" filter="url(#bh-blur)"/>
      <ellipse cx="100" cy="100" rx="94" ry="15" fill="none" stroke="url(#bh-disk)" stroke-width="2" opacity="0.5"/>
      <ellipse cx="100" cy="100" rx="82" ry="13" fill="none" stroke="url(#bh-disk)" stroke-width="7" opacity="0.85"/>
      <ellipse cx="100" cy="100" rx="66" ry="10.5" fill="none" stroke="url(#bh-disk)" stroke-width="7"/>
      <ellipse cx="100" cy="100" rx="56" ry="9" fill="none" stroke="#F0F9FF" stroke-width="2" opacity="0.8"/>
    </g>
    <!-- event horizon wrapped in a razor-thin photon ring -->
    <circle cx="100" cy="100" r="36.5" fill="#020308" stroke="url(#bh-ring)" stroke-width="2"/>
    <!-- near side of the disk crosses in front of the horizon -->
    
    <g clip-path="url(#bh-front)">
      <ellipse cx="100" cy="100" rx="78" ry="13" fill="none" stroke="url(#bh-disk)" stroke-width="16" opacity="0.6" filter="url(#bh-blur)"/>
      <ellipse cx="100" cy="100" rx="94" ry="15" fill="none" stroke="url(#bh-disk)" stroke-width="2" opacity="0.5"/>
      <ellipse cx="100" cy="100" rx="82" ry="13" fill="none" stroke="url(#bh-disk)" stroke-width="7" opacity="0.85"/>
      <ellipse cx="100" cy="100" rx="66" ry="10.5" fill="none" stroke="url(#bh-disk)" stroke-width="7"/>
      <ellipse cx="100" cy="100" rx="56" ry="9" fill="none" stroke="#F0F9FF" stroke-width="2" opacity="0.8"/>
    </g>
  </g>
</svg>

<text x="410" y="290" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="116" letter-spacing="-5" fill="url(#card-text)">omnix</text>
<text x="416" y="350" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#e8eef8">NixOS reproducibility,</text>
<text x="416" y="394" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#e8eef8">with an ordinary <tspan fill="#7ebae4">/usr/bin.</tspan></text>
<text x="416" y="449" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#9fb3d1">Autarchy / Hyprland · Atrium / KDE Plasma</text>
<path d="M80 535H1120" stroke="#5277c3" stroke-opacity=".3"/>
<text x="80" y="577" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#9fb3d1">www.omnix-linux.com</text>
</svg>
